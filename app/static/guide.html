<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="按棋子查询金铲铲装备搭配、神器、纹章与站位。自然之力、大橘大利资料分开展示，推荐保留来源与适用条件。">
  <title>棋子装备与站位 · 弈策</title>
  <link rel="stylesheet" href="./guide.css">
  <script src="./guide.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#hero-detail">跳到棋子详情</a>
  <header class="site-header">
    <a class="brand" href="../" aria-label="弈策首页"><span class="brand-mark">弈</span><span>弈策<small>STRATEGY LIBRARY</small></span></a>
    <nav aria-label="页面导航"><a href="../">返回首页 <span aria-hidden="true">↗</span></a><a href="https://github.com/Yinita/jcc-expert" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main class="page-shell">
    <section class="page-heading" aria-labelledby="page-title">
      <div><p class="eyebrow">CHAMPIONS / ITEMS / POSITIONING</p><h1 id="page-title">每个棋子，都有发挥的位置<span>.</span></h1><p class="heading-description">查装备，找组合，摆对位置。先选一位棋子，再看适合当前路线的选择。</p></div>
      <div class="mode-switch" role="group" aria-label="选择玩法"><button type="button" data-mode="nature" class="selected" aria-pressed="true">自然之力<small>标准阵容</small></button><button type="button" data-mode="orange" aria-pressed="false">大橘大利<small>卡组 × 阵容</small></button></div>
    </section>
    <div class="version-strip" role="note"><span class="version-badge" id="version-badge">规则资料载入中</span><p id="data-notice">推荐保留版本与来源；搭配建议不等于当前对局胜率。</p><span id="data-as-of" class="data-date"></span></div>
    <div id="load-message" class="load-message" role="status" aria-live="polite"><span class="loading-dot"></span>正在打开棋子图鉴…</div>
    <div id="guide-workspace" class="guide-workspace" hidden>
      <aside class="roster-panel" aria-labelledby="roster-title">
        <div class="roster-heading"><h2 id="roster-title">选择棋子</h2><span id="hero-count">—</span></div>
        <label class="search-field"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.5"/></svg><input type="search" id="hero-search" placeholder="搜索棋子、羁绊或 ID" autocomplete="off" aria-label="搜索棋子、羁绊或 ID"><kbd>/</kbd></label>
        <div class="filter-pair"><label>费用<select id="cost-filter"><option value="">全部费用</option></select></label><label>定位<select id="role-filter"><option value="">全部定位</option></select></label></div>
        <label class="trait-filter">羁绊<select id="trait-filter"><option value="">全部羁绊</option></select></label>
        <label class="special-unit-toggle"><input type="checkbox" id="special-units">显示特殊单位（召唤物等）</label>
        <div id="hero-list" class="hero-list" aria-label="棋子列表"></div>
        <div id="empty-roster" class="empty-roster" hidden><span aria-hidden="true">⌕</span><strong>没有找到符合条件的棋子</strong><p>试试其他名称，或清除筛选。</p><button type="button" id="reset-filters" class="text-button">清除筛选</button></div>
      </aside>
      <section id="hero-detail" class="hero-detail" aria-label="棋子装备与站位详情" tabindex="-1"><div class="detail-placeholder">选择左侧棋子，查看装备与站位。</div></section>
    </div>
    <footer><span>弈策 · 棋子装备与站位</span><p>优先展示有来源的搭配；实际选择仍取决于来装、强化符文、阵容与对手。</p><a href="https://github.com/Yinita/jcc-expert" target="_blank" rel="noopener noreferrer">查看项目与数据说明 ↗</a></footer>
  </main>
  <dialog id="item-dialog" class="item-dialog" aria-labelledby="item-dialog-title"><div class="dialog-heading"><span class="eyebrow">ITEM DETAILS</span><button type="button" id="close-item" class="icon-button" aria-label="关闭装备详情">×</button></div><div id="item-dialog-body"></div></dialog>
</body>
</html>
